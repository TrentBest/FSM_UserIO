name: Build, test, and package UserIO

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified package to NuGet.org"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheSingularityWorkshop.FSM_UserIO.slnx

      - name: Build
        run: dotnet build TheSingularityWorkshop.FSM_UserIO.slnx --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test TheSingularityWorkshop.FSM_UserIO.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage;Format=cobertura"
          --results-directory ./TestResults
          --logger "trx;LogFileName=testresults.trx"

      - name: Prepare coverage report
        shell: bash
        run: |
          set -euo pipefail
          coverage_file="$(find ./TestResults -type f -name 'coverage.cobertura.xml' -print -quit)"
          if [[ -z "$coverage_file" ]]; then
            echo "No coverage.cobertura.xml file was produced."
            find ./TestResults -maxdepth 4 -type f -print || true
            exit 1
          fi
          cp "$coverage_file" ./TestResults/coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Pack
        run: dotnet pack TheSingularityWorkshop.FSM_UserIO.csproj --configuration Release --no-build --output ./artifacts

      - name: Verify packaged documentation paths
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "No NuGet package was produced."
            exit 1
          fi
          entries="$(unzip -Z1 "$package")"
          for required_path in "README.md" "LICENSE.txt" "docs/API_CONTRACTS.md"; do
            if ! grep -Fxq "$required_path" <<< "$entries"; then
              echo "Expected package entry is missing: $required_path"
              printf '%s\\n' "$entries"
              exit 1
            fi
          done

      - name: Verify package in a clean consumer project
        shell: bash
        run: |
          set -euo pipefail
          package="$(find ./artifacts -maxdepth 1 -type f -name '*.nupkg' -print -quit)"
          package_id="$(unzip -p "$package" '*.nuspec' | sed -n 's/.*<id>\([^<]*\)<\/id>.*/\1/p' | head -n 1)"
          package_version="$(unzip -p "$package" '*.nuspec' | sed -n 's/.*<version>\([^<]*\)<\/version>.*/\1/p' | head -n 1)"
          if [[ -z "$package_id" || -z "$package_version" ]]; then
            echo "Could not read package ID/version from the generated NuGet package."
            exit 1
          fi
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          dotnet new console --framework net8.0 --output "$consumer_dir" --no-restore
          dotnet add "$consumer_dir" package "$package_id" --version "$package_version" --source "$PWD/artifacts"
          dotnet build "$consumer_dir" --configuration Release

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: fsm-userio-nuget-package
          path: ./artifacts/*.nupkg

      - name: Upload test and coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsm-userio-test-results
          path: ./TestResults/*

  publish_nuget:
    needs: build-and-test
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/development' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: fsm-userio-nuget-package
          path: ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: TheSingularityWorkshop

      - name: Publish package to NuGet.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
