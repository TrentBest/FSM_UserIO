<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">FSM_UserIO semantic interaction boundary</title>
  <desc id="desc">Conceptual information-flow map. An actor or form passes through a source or surface adapter into FSM_UserIO semantic interaction, which can be consumed by an application host and other surfaces. The host owns policy and execution. Arrows show information flow, not package dependencies.</desc>
  <rect width="960" height="480" rx="20" fill="#101827"/>
  <text x="40" y="44" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700">FSM_UserIO · semantic boundary</text>
  <text x="40" y="70" fill="#b9c7d8" font-family="Segoe UI, sans-serif" font-size="14">CONCEPTUAL ARCHITECTURE · information flow, not package references</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="40" y="116" width="180" height="78" rx="12" fill="#183d56" stroke="#50b9e8" stroke-width="3"/>
    <text x="130" y="148" fill="#ffffff" font-size="17" font-weight="700">Actor / form</text>
    <text x="130" y="172" fill="#d4eaf5" font-size="13">capabilities</text>
    <rect x="280" y="116" width="190" height="78" rx="12" fill="#26394d" stroke="#9cc9ee" stroke-width="3"/>
    <text x="375" y="148" fill="#ffffff" font-size="17" font-weight="700">Source / surface</text>
    <text x="375" y="172" fill="#d4e1ed" font-size="13">adapter</text>
    <rect x="530" y="106" width="190" height="98" rx="12" fill="#174d42" stroke="#45d6a1" stroke-width="4"/>
    <text x="625" y="140" fill="#ffffff" font-size="18" font-weight="700">FSM_UserIO</text>
    <text x="625" y="164" fill="#d4f8eb" font-size="14">semantic intent</text>
    <text x="625" y="185" fill="#d4f8eb" font-size="12">source-neutral</text>
    <rect x="770" y="116" width="150" height="78" rx="12" fill="#44351e" stroke="#f4bf62" stroke-width="3"/>
    <text x="845" y="148" fill="#ffffff" font-size="16" font-weight="700">Host / app</text>
    <text x="845" y="172" fill="#ffebc9" font-size="13">meaning</text>
    <g stroke="#d6e2ef" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M220 155 H268 M258 146 L268 155 L258 164"/>
      <path d="M470 155 H518 M508 146 L518 155 L508 164"/>
      <path d="M720 155 H758 M748 146 L758 155 L748 164"/>
    </g>
    <path d="M845 194 V260" stroke="#f4bf62" stroke-width="3" fill="none"/>
    <path d="M836 250 L845 260 L854 250" stroke="#f4bf62" stroke-width="3" fill="none"/>
    <rect x="710" y="270" width="210" height="76" rx="12" fill="#44351e" stroke="#f4bf62" stroke-width="3"/>
    <text x="815" y="300" fill="#ffffff" font-size="17" font-weight="700">Policy + execution</text>
    <text x="815" y="323" fill="#ffebc9" font-size="13">host-owned decision</text>
    <path d="M625 204 V244 H360 V270" stroke="#45d6a1" stroke-width="2.5" fill="none" stroke-dasharray="7 6"/>
    <path d="M351 260 L360 270 L369 260" stroke="#45d6a1" stroke-width="2.5" fill="none"/>
    <rect x="235" y="270" width="250" height="76" rx="12" fill="#23334b" stroke="#8c9fe8" stroke-width="2.5"/>
    <text x="360" y="300" fill="#ffffff" font-size="16" font-weight="700">Optional consumers</text>
    <text x="360" y="323" fill="#dbe1ff" font-size="13">ProtocolAi · GUI · other surfaces</text>
    <text x="40" y="410" fill="#b9c7d8" font-size="14" text-anchor="start">Intent is meaning, not permission. FSM_UserIO does not authenticate, authorize, or execute it.</text>
    <text x="40" y="440" fill="#8fa4bb" font-size="12" text-anchor="start">Architecture map only · the current package exposes SemanticIntent(Name, ProtocolId?)</text>
  </g>
</svg>
